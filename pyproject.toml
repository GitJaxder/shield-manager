[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shield-manager"
version = "0.2.2"
description = "Deploy apps, packages, and updates to Nvidia Shield devices over ADB"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "adb-shell>=0.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
shield-manager = "shield_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shield_manager"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
