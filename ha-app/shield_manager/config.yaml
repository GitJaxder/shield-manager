name: Shield Manager
version: "0.3.0"
slug: shield_manager
description: Keep the apps on your Nvidia Shields in sync and install apps from an app-store screen
url: https://github.com/GitJaxder/shield-manager
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8765
panel_icon: mdi:television-play
panel_title: Shield Manager
# No access to Home Assistant's own files: to reuse the Android TV integration's ADB key,
# paste it into the adb_key option.
schema:
  adb_key: password?
